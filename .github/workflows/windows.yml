# Windows edition (RTX Spark: Windows 11 on Arm) on GitHub's Windows-on-Arm
# machines. They have no GPU, so the install runs in test mode (small CPU
# models, windows/setup.ps1 -Test) and the self-test checks that every stage
# works, not that a tiny model gets the facts right. What it cannot check:
# GPU speed and memory on the real RTX Spark.
name: Windows on Arm

on:
  push:
    branches: [main]
    paths:
      - install.ps1
      - windows/**
      - app/**
      - scripts/*.py
      - hands-on-1-finetune/**
      - hands-on-2-rag/**
      - hands-on-3-agent/**
      - workshop.env
      - .github/workflows/windows.yml
  pull_request:
    paths:
      - install.ps1
      - windows/**
      - app/**
      - scripts/*.py
      - hands-on-1-finetune/**
      - hands-on-2-rag/**
      - hands-on-3-agent/**
      - workshop.env
      - .github/workflows/windows.yml
  workflow_dispatch:

jobs:
  install-and-run:
    runs-on: windows-11-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install folder
        shell: powershell
        run: Add-Content -Path $env:GITHUB_ENV -Value "WORKSHOP_DIR=$env:RUNNER_TEMP\ai-workshop"

      - name: Scripts parse in Windows PowerShell 5.1, with a BOM where needed
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem windows\*.ps1, install.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) { $bad++; Write-Host "$($_.Name):$($e.Extent.StartLineNumber): $($e.Message)" }
            $b = [IO.File]::ReadAllBytes($_.FullName)
            $bom = $b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF
            $ascii = -not ($b | Where-Object { $_ -gt 127 } | Select-Object -First 1)
            if (-not $ascii -and -not $bom) { $bad++; Write-Host "$($_.Name): non-ASCII text without a UTF-8 BOM (5.1 would misread it)" }
            if ($_.Name -eq 'install.ps1' -and -not $ascii) { $bad++; Write-Host 'install.ps1 must stay ASCII (irm | iex)' }
          }
          if ($bad) { exit 1 }
          Write-Host 'all scripts parse'

      - name: Install with the one-line command (test mode)
        shell: powershell
        env:
          WORKSHOP_BRANCH: ${{ github.event.pull_request.head.sha || github.sha }}   # this exact commit
          WORKSHOP_REPO: ${{ github.repository }}
          WORKSHOP_YES: '1'
          WORKSHOP_NO_START: '1'
          WORKSHOP_TEST: '1'
        run: |
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
          Write-Host "setup exit code: $LASTEXITCODE"
          exit $LASTEXITCODE

      - name: Run the setup again (an update must be quick and keep everything)
        shell: powershell
        env:
          WORKSHOP_SKIP_CHECK: '1'
        run: |
          $t = [Diagnostics.Stopwatch]::StartNew()
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:WORKSHOP_DIR\windows\setup.ps1" -Yes -NoStart -Test
          $code = $LASTEXITCODE
          Write-Host "second run: exit $code in $([int]$t.Elapsed.TotalSeconds) s"
          exit $code

      - name: Start the app and use it like the page does
        shell: powershell
        run: |
          $dir = $env:WORKSHOP_DIR
          $env:PYTHONUTF8 = '1'
          $server = Start-Process "$dir\.venv\Scripts\python.exe" -ArgumentList "`"$dir\app\server.py`" --no-warmup" `
            -PassThru -RedirectStandardOutput "$dir\.run\server-out.txt" -RedirectStandardError "$dir\.run\server-err.txt"
          $h = $null
          for ($i = 0; $i -lt 60 -and -not $h; $i++) {
            try { $h = Invoke-RestMethod http://127.0.0.1:8090/api/health -TimeoutSec 3 } catch { Start-Sleep 1 }
          }
          if (-not $h) { throw 'the app did not answer' }
          $h | ConvertTo-Json -Depth 4
          if ($h.edition -ne 'windows') { throw "edition is $($h.edition)" }
          if ($h.features.sandbox -or $h.features.openclaw) { throw 'the Windows edition must not offer the sandbox or OpenClaw' }
          if (-not $h.ollama -or -not $h.chat_model.ready -or -not $h.embed_model.ready) { throw 'models not ready' }

          $page = (Invoke-WebRequest http://127.0.0.1:8090/ -UseBasicParsing).Content
          if ($page -notmatch 'window\.WORKSHOP=\{"edition": "windows"') { throw 'the page lacks the Windows edition settings' }

          $q = @{ question = 'What is the usable energy of the AX-600 battery cabinet?'; lang = 'en' } | ConvertTo-Json
          $r = Invoke-WebRequest http://127.0.0.1:8090/api/lab2/ask/stream -Method Post -Body $q `
            -ContentType 'application/json' -UseBasicParsing -TimeoutSec 900
          # Windows PowerShell 5.1 gives a non-text/* body (application/x-ndjson) as bytes: decode it.
          $text = [Text.Encoding]::UTF8.GetString($r.RawContentStream.ToArray())
          $events = $text -split "`n" | Where-Object { $_.Trim() } | ForEach-Object { ConvertFrom-Json $_ }
          $answer = $events | Where-Object { $_.event -eq 'answer' } | Select-Object -First 1
          if (-not $answer -or -not $answer.answer) { throw "Lab 2 gave no answer: $($text.Substring(0, [Math]::Min(600, $text.Length)))" }
          Write-Host "Lab 2 via $($answer.source), $($answer.sources.Count) passages: $($answer.answer.Substring(0, [Math]::Min(200, $answer.answer.Length)))"

          $info = Invoke-RestMethod http://127.0.0.1:8090/api/lab3/info -TimeoutSec 60
          if (-not $info.tools_ok) { throw "Lab 3 tools unavailable: $($info.tools_reason)" }
          $l1 = Invoke-RestMethod http://127.0.0.1:8090/api/lab1/info -TimeoutSec 60
          Write-Host "Lab 1 trainer: $($l1.trainer | ConvertTo-Json -Compress)"
          if (-not $l1.trainer.ready) { throw "Lab 1 training should be ready after setup: $($l1.trainer.reason)" }

          # Enterprise: offered once its engine is installed; one small batch through the page's API.
          if (-not $h.features.enterprise) { throw 'the Enterprise tab should be offered once its engine is installed' }
          $sum = Invoke-RestMethod http://127.0.0.1:8090/api/ent/summary -TimeoutSec 60
          Write-Host "enterprise installed: $($sum.installed | ConvertTo-Json -Compress)"
          if (-not $sum.installed.image -or -not $sum.installed.model -or -not $sum.installed.asr) { throw 'Enterprise is not fully installed' }
          $body = @{ demo = 'inbox'; limit = 8; engine = 'vllm' } | ConvertTo-Json
          $start = Invoke-RestMethod http://127.0.0.1:8090/api/ent/start -Method Post -ContentType 'application/json' -Body $body
          if (-not $start.ok) { throw "the batch did not start: $($start.detail)" }
          $inbox = $null
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 5
            $inbox = (Invoke-RestMethod http://127.0.0.1:8090/api/ent/summary -TimeoutSec 30).demos.inbox
            if ($inbox.status -notin @('running', 'engine', 'preparing', 'queued', 'stopping')) { break }
          }
          Write-Host "inbox batch: $($inbox.status) $($inbox.message), processed $($inbox.processed), errors $($inbox.errors)"
          if ($inbox.processed -lt 8) { throw 'the inbox batch did not process its 8 messages' }
          $null = Invoke-RestMethod http://127.0.0.1:8090/api/ent/engine -Method Post -ContentType 'application/json' -Body '{"action": "stop"}'

          # Both pages in a real browser: their scripts must run without errors.
          # "/" is the studio page on Windows; the event page stays at /classic.
          $edge = @("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe", "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($edge) {
            # Edge logs harmless warnings to stderr; under 'Stop' PowerShell 5.1 would treat them as errors.
            $ErrorActionPreference = 'Continue'
            $dom = & $edge --headless=new --disable-gpu --no-first-run --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8090/classic 2>$null | Out-String
            $studio = & $edge --headless=new --disable-gpu --no-first-run --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8090/ 2>$null | Out-String
            $ErrorActionPreference = 'Stop'
            if ($dom -notmatch '<html[^>]*class="[^"]*no-openclaw') { throw 'the classic page did not apply the Windows edition' }
            if ($dom -notmatch 'id="agenda"><li') { throw 'the classic page script did not render (agenda empty)' }
            if ($dom -notmatch 'data-i18n="home_eyebrow"[^>]*>[^<]*RTX Spark') { throw 'the Windows wording is missing' }   # GSAP adds a style attribute
            if ($studio -notmatch 'studio\.js') { throw '/ is not the studio page' }
            # GSAP leaves a (possibly empty) style attribute on what it animated: allow attributes after the id.
            if ($studio -notmatch 'id="home-index"[^>]*><li><button type="button" class="chap"') { throw 'the studio page script did not render (no labs)' }
            if ($studio -notmatch 'id="home-specs"[^>]*><div class="spec"') { throw 'the studio page script did not render (no machine specs)' }
            if ($studio -notmatch 'id="mx-list"[^>]*><button type="button" class="mx-row') { throw 'the studio page script did not render (no RTX Spark section)' }
            Write-Host 'both pages render in Edge with the Windows edition'
          } else { Write-Host 'Edge not found: browser check skipped' }
          Stop-Process -Id $server.Id -Force

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm-logs
          path: |
            ${{ runner.temp }}\ai-workshop\setup-log.txt
            ${{ runner.temp }}\ai-workshop\.run\*.txt
            ${{ runner.temp }}\ai-workshop\.run\*.json
            ${{ runner.temp }}\ai-workshop\.run\*.log
            ${{ runner.temp }}\ai-workshop\.run\enterprise\*.log
            ${{ runner.temp }}\ai-workshop\.run\enterprise\jobs\*\*.log
          if-no-files-found: ignore
